name: Temporary registrar-backed domain check

on:
  push:
    paths:
      - 'tmp-domain-registrar-input.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check public availability and registrar pricing
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json, time
          from urllib.request import Request, urlopen

          with open('tmp-domain-registrar-input.txt', encoding='utf-8') as f:
              domains=[x.strip().lower() for x in f if x.strip()]
          rows=[]
          for i, domain in enumerate(domains,1):
              status='unknown'; available=''; pricing=''; detail=''; raw=''
              try:
                  body=json.dumps({'domain':domain}).encode()
                  req=Request('https://api.namecrawl.dev/v1/public/check', data=body,
                              headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'OwL35-domain-check/1.0'},
                              method='POST')
                  with urlopen(req,timeout=40) as resp:
                      raw=resp.read().decode('utf-8','replace')
                      data=json.loads(raw)
                  results=((data.get('data') or {}).get('results') or [])
                  item=next((r for r in results if str(r.get('tld','')).lower()=='.com' or str(r.get('fqdn','')).lower()==domain),None)
                  if item:
                      available=item.get('available')
                      status=str(item.get('status','unknown'))
                      pricing=json.dumps(item.get('pricing') or [], ensure_ascii=False)
                  else:
                      detail='No .com result in response'
              except Exception as e:
                  detail=repr(e)
              rows.append({'domain':domain,'registrar_status':status,'available':available,'pricing':pricing,'detail':detail,'raw':raw[:4000]})
              print(f'[{i}/{len(domains)}] {domain}: {status} available={available} {detail}',flush=True)
              if i < len(domains): time.sleep(13)
          with open('tmp-domain-registrar-results.csv','w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=['domain','registrar_status','available','pricing','detail','raw']); w.writeheader(); w.writerows(rows)
          with open('tmp-domain-registrar-results.json','w',encoding='utf-8') as f:
              json.dump(rows,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tmp-domain-registrar-results
          path: |
            tmp-domain-registrar-results.csv
            tmp-domain-registrar-results.json
          retention-days: 1
