name: Temporary .com domain check

on:
  push:
    paths:
      - 'tmp-domain-check-input.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check .com registration via Verisign RDAP
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          with open('tmp-domain-check-input.txt', encoding='utf-8') as f:
              domains = [line.strip().lower() for line in f if line.strip()]

          rows = []
          for i, domain in enumerate(domains, 1):
              url = f'https://rdap.verisign.com/com/v1/domain/{domain}'
              req = Request(url, headers={'Accept': 'application/rdap+json', 'User-Agent': 'OwL35-domain-check/1.0'})
              status = 'unknown'
              http_status = None
              detail = ''
              for attempt in range(5):
                  try:
                      with urlopen(req, timeout=20) as response:
                          http_status = response.status
                          response.read(256)
                          status = 'registered' if response.status == 200 else 'unknown'
                          break
                  except HTTPError as e:
                      http_status = e.code
                      if e.code == 404:
                          status = 'unregistered_rdap'
                          break
                      if e.code == 429 or 500 <= e.code < 600:
                          time.sleep(2 ** attempt)
                          continue
                      detail = f'HTTP {e.code}'
                      break
                  except (URLError, TimeoutError) as e:
                      detail = str(e)
                      time.sleep(2 ** attempt)
              rows.append({'domain': domain, 'status': status, 'http_status': http_status or '', 'detail': detail})
              print(f'[{i}/{len(domains)}] {domain}: {status} ({http_status})', flush=True)
              time.sleep(0.35)

          with open('tmp-domain-check-results.csv', 'w', newline='', encoding='utf-8-sig') as f:
              writer = csv.DictWriter(f, fieldnames=['domain', 'status', 'http_status', 'detail'])
              writer.writeheader()
              writer.writerows(rows)
          with open('tmp-domain-check-results.json', 'w', encoding='utf-8') as f:
              json.dump(rows, f, ensure_ascii=False, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tmp-domain-check-results
          path: |
            tmp-domain-check-results.csv
            tmp-domain-check-results.json
          retention-days: 1
