name: Temporary secondary domain availability check

on:
  push:
    paths:
      - 'tmp-domain-secondary-input.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check availability
        shell: bash
        env:
          DOMAINDUCK_TEST_KEY: VH2PS6QZ5FYD
        run: |
          python3 - <<'PY'
          import csv, json, random, time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          with open('tmp-domain-secondary-input.txt', encoding='utf-8') as f:
              domains = [line.strip().lower() for line in f if line.strip()]
          rows=[]
          for i, domain in enumerate(domains, 1):
              params = urlencode({'domain': domain, 'apikey': 'VH2PS6QZ5FYD', 'rand': random.randint(10**9, 10**10-1)})
              url = 'https://v2-api.domainduck.io/get/?' + params
              status='unknown'; detail=''; raw=''
              try:
                  req=Request(url, headers={'Accept':'application/json','User-Agent':'OwL35-domain-check/1.0'})
                  with urlopen(req, timeout=30) as response:
                      raw=response.read().decode('utf-8','replace')
                      data=json.loads(raw)
                      status=str(data.get('availability','unknown')).lower()
                      detail=str(data.get('warning') or data.get('error') or data.get('price') or '')
              except Exception as e:
                  detail=repr(e)
              rows.append({'domain':domain,'secondary_status':status,'detail':detail,'raw':raw[:1000]})
              print(f'[{i}/{len(domains)}] {domain}: {status} {detail}', flush=True)
              time.sleep(0.7)
          with open('tmp-domain-secondary-results.csv','w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=['domain','secondary_status','detail','raw']); w.writeheader(); w.writerows(rows)
          with open('tmp-domain-secondary-results.json','w',encoding='utf-8') as f:
              json.dump(rows,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tmp-domain-secondary-results
          path: |
            tmp-domain-secondary-results.csv
            tmp-domain-secondary-results.json
          retention-days: 1
